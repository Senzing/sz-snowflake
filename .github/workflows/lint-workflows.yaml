name: Lint workflows

on:
  pull_request:
    branches: [main]

concurrency:
  # `github.ref`, not `head_ref || ref_name`: those two put a branch named
  # `1.0.0` and a tag named `1.0.0` into the same concurrency group, and this
  # repository's tags are bare semver. `github.ref` cannot collide.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint-workflows:
    permissions:
      contents: read
      packages: read
      pull-requests: write
      statuses: write
    uses: senzing-factory/build-resources/.github/workflows/lint-workflows.yaml@v4
