name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  # `github.ref`, not `head_ref || ref_name`: those two put a branch named
  # `1.0.0` and a tag named `1.0.0` into the same concurrency group, and this
  # repository's tags are bare semver. `github.ref` cannot collide.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    uses: senzing-factory/build-resources/.github/workflows/claude-pull-request-review.yaml@v4
    permissions:
      contents: read
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
