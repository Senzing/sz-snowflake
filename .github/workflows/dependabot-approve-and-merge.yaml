name: Dependabot approve and merge

on:
  pull_request:
    branches: [main]

concurrency:
  # `github.ref`, not `head_ref || ref_name`: those two put a branch named
  # `1.0.0` and a tag named `1.0.0` into the same concurrency group, and this
  # repository's tags are bare semver. `github.ref` cannot collide.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependabot-approve-and-merge:
    permissions:
      contents: write
      pull-requests: write
    secrets:
      CODEOWNER_PR_RW_TOKEN: ${{ secrets.SENZING_GITHUB_CODEOWNER_PR_RW_TOKEN }}
    uses: senzing-factory/build-resources/.github/workflows/dependabot-approve-and-merge.yaml@v4
