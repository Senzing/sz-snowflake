name: Sign release

# Signs the files of a release as THIS workflow, so that customers verify one
# identity that names only this repository:
#
#   https://github.com/Senzing/sz-snowflake/.github/workflows/sign-release.yaml@refs/tags/<release>
#
# THIS WORKFLOW AUTHENTICATES TO NOTHING OUTSIDE THIS REPOSITORY, and it builds
# nothing. The release -- the bundle with the Native App files and the container
# images, the infrastructure script, the install script and SHA256SUMS -- is
# built elsewhere and PUSHED here, as a release created by a single publishing account. This
# workflow reads that release with its own GITHUB_TOKEN, checks it, signs each
# file keyless (cosign sign-blob, the OIDC token of this run) and attaches
# <file>.sigstore.json for each file, SHA256SUMS included.
#
# That is the whole reason the direction was reversed. The previous design
# handed a GitHub App private key to `pull_request` runs. A non-fork pull
# request receives secrets AND runs the workflow definition from the pull
# request head, so anyone with write on a public repository in this
# organization could have added a step that exfiltrated the key. Nothing added
# to THIS file can recreate that exposure, because there is no credential here
# that reaches anything else -- keep it that way.
#
# THE RELEASE IS <senzing_version>-<build>, e.g. 4.4.3-7: no `v`, an integer
# build. These are releases, not pre-releases, so "latest" is decided by the
# publisher with scripts/version_order.sh.
#
# THERE IS DELIBERATELY NO workflow_dispatch. Tag creation here is restricted by
# ruleset to a single actor, so a manual run that SIGNED something would sign
# without a release and route around that control.

on:
  release:
    types:
      - published

concurrency:
  # `github.ref` is `refs/tags/<release>`; two releases published on the same tag
  # wait for one another, and a signing run is never cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  sign:
    name: sign the release files
    permissions:
      # Attaches the signatures to the release this workflow was triggered by.
      contents: write
      # The keyless signing identity.
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `github.event.release.tag_name` becomes part of the signing identity, so it
      # is checked before anything is downloaded.
      #
      # <senzing_version>-<build> and nothing else: no `v`, no leading zeros, no
      # pre-release suffix. GitHub's "Set as a pre-release" checkbox is not part
      # of the tag at all, so a release ticked that way passes every string test
      # here; it is rejected for the same reason: `latest` would skip it.
      #
      # WHO PUBLISHED IT. A release signed here must have been authored by the
      # account whose fine-grained token the build publishes with, whose login is
      # the repository variable PAYLOAD_PUBLISHER_LOGIN. The tag
      # ruleset already stops anyone else from creating a tag; this stops a
      # release someone else made on an existing tag from being signed as
      # Senzing. Fail closed: with the variable unset nothing is signed.
      - name: Validate the release
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          AUTHOR: ${{ github.event.release.author.login }}
          EXPECTED_AUTHOR: ${{ vars.PAYLOAD_PUBLISHER_LOGIN }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[1-9][0-9]*$ ]]; then
            echo "::error::Release tag '${TAG}' is not <senzing_version>-<build> (e.g. 4.4.3-7: no v prefix, an integer build, no leading zeros)."
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ]; then
            echo "::error::Release ${TAG} is marked as a pre-release; clear 'Set as a pre-release' or cut a normal release."
            exit 1
          fi
          if [ -z "$EXPECTED_AUTHOR" ]; then
            echo "::error::The repository variable PAYLOAD_PUBLISHER_LOGIN is not set, so the author of release ${TAG} cannot be checked. Set it to the login of the account that publishes releases."
            exit 1
          fi
          if [ "$AUTHOR" != "$EXPECTED_AUTHOR" ]; then
            echo "::error::Release ${TAG} was published by '${AUTHOR}', not by the payload publisher '${EXPECTED_AUTHOR}'. Refusing to sign it."
            exit 1
          fi
          echo "[INFO] release ${TAG} is a <senzing_version>-<build>, non-pre-release version published by ${AUTHOR}"

      # `release: published` FIRES ON THE RELEASE, NOT ON ITS ASSETS. The publisher
      # creates the release with its files in one call, which publishes only after
      # the upload; this wait is the backstop for a release cut the other way
      # round, and the only thing it can turn into is a clear error. An asset's
      # `state` is `open` while it is uploading and `uploaded` once complete.
      #
      # A SIGNED VERSION IS NEVER RE-SIGNED. SHA256SUMS.sigstore.json is attached
      # last, so its presence means a signing run finished; a second one would put
      # a signature on whatever the release holds now, which may no longer be what
      # was published. A run that failed before that file can be re-run.
      - name: Download the release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=40
          mkdir -p assets
          while true; do
            names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[] | select(.state == "uploaded") | .name')"
            if printf '%s\n' "$names" | grep -qx 'SHA256SUMS.sigstore.json'; then
              echo "::error::Release ${TAG} already carries SHA256SUMS.sigstore.json: a signed version is never re-signed. Cut the next build instead."
              exit 1
            fi
            if printf '%s\n' "$names" | grep -qx 'SHA256SUMS'; then
              rm -rf assets/SHA256SUMS
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir assets
              complete=true
              while read -r _ listed; do
                printf '%s\n' "$names" | grep -qxF "$listed" || complete=false
              done < assets/SHA256SUMS
              [ "$complete" = true ] && break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Release ${TAG} does not hold SHA256SUMS and every file it lists, uploaded."
              exit 1
            fi
            echo "[INFO] waiting for the release files (attempt ${attempt}/${max_attempts})"
            attempt=$((attempt + 1))
            sleep 15
          done
          rm -rf assets
          mkdir -p assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          ls -l assets

      # THE CHECKSUMS ARE INTEGRITY, NOT AUTHENTICITY. They travel with the files
      # on the same release, so anyone who can attach one asset can attach both.
      # What stands between a swapped file and a signature is who may create the
      # release (the author check above), who may create its tag (the ruleset),
      # and that a signed version is never re-signed. The set is exact: every file
      # found here is signed, so an extra one is refused.
      - name: The release files are the contracted set and match SHA256SUMS
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          scripts/check_release_assets.sh assets "$TAG"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Every file and SHA256SUMS itself, keyless, as this workflow at this tag.
      # Each signature is verified straight away against the exact identity
      # customers use; SHA256SUMS goes last, so its signature marks a finished run.
      - name: Sign every file (cosign sign-blob)
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        working-directory: assets
        run: |
          set -euo pipefail
          mkdir -p ../bundles
          for asset in $(awk '{ print $2 }' SHA256SUMS) SHA256SUMS; do
            cosign sign-blob --yes --bundle "../bundles/${asset}.sigstore.json" "$asset"
            cosign verify-blob --bundle "../bundles/${asset}.sigstore.json" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              --certificate-identity "https://github.com/${WORKFLOW_REF}" \
              "$asset" > /dev/null
          done
          ls -l ../bundles

      - name: Attach the signatures to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          identity="https://github.com/${WORKFLOW_REF}"
          {
            echo
            echo "## Verify"
            echo "Every file is signed as \`${identity}\`; see README.md."
            echo '```bash'
            echo "sha256sum -c SHA256SUMS"
            echo "cosign verify-blob --bundle <file>.sigstore.json --certificate-identity '${identity}' \\"
            echo "  --certificate-oidc-issuer ${OIDC_ISSUER} <file>"
            echo '```'
          } > notes.md
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          printf '%s\n%s\n' "$body" "$(cat notes.md)" > full.md
          # SHA256SUMS.sigstore.json last: it marks a finished run.
          for f in bundles/*.sigstore.json; do
            [ "$f" = bundles/SHA256SUMS.sigstore.json ] && continue
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$f"
          done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber bundles/SHA256SUMS.sigstore.json
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file full.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

  # A failed signing run publishes nothing customers could verify, and nobody is
  # watching it, so it is announced. `SLACK_BOT_TOKEN` and `SLACK_CHANNEL` are
  # `Senzing` ORG secrets and whether they are visible to this repository has NOT
  # been confirmed -- the sandbox credential cannot read org secrets (403).
  # Unguarded, an absent token turns a failed release into TWO red jobs, the
  # second one about Slack, which buries the first. The token itself reaches only
  # the notification step: the job-level `env:` carries a boolean.
  notify:
    name: notify on failure
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    needs: [sign]
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_CONFIGURED: ${{ secrets.SLACK_BOT_TOKEN != '' }}

    steps:
      - name: Notify Slack on failure
        if: ${{ env.SLACK_CONFIGURED == 'true' }}
        uses: senzing-factory/build-resources/slack-failure-notification@v4
        with:
          job-status: failure
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          # The repository only: this runs on failure(), which includes the run
          # where "Validate the release" rejected the tag, and that tag is the
          # one input the workflow refused to trust.
          additional-info: "${{ github.repository }}: sign release"
