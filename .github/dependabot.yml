# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# `cooldown.default-days: 21` delays routine *version* bumps for 21 days after
# publication (protection against yanked/regressed/compromised releases).
# Cooldown does NOT apply to *security* updates.

version: 2
updates:
  # GitHub Actions used by the workflows in .github/workflows/
  # Workflow/action bumps are infrastructure -- they go to the infrastructure
  # maintainer, not to whoever owns the image contents.
  - package-ecosystem: "github-actions"
    assignees:
      - "kernelsam"
    cooldown:
      default-days: 21
      # First-party Senzing actions bypass the cooldown -- they are our own
      # releases, so their updates land immediately rather than waiting 21
      # days like third-party actions.
      exclude:
        - "senzing-factory/*"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    groups:
      # Grouped on its own so the cooldown-bypassed factory updates land as
      # one immediate PR, separate from the cooled-down third-party actions.
      senzing-factory:
        patterns:
          - "senzing-factory/*"
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "senzing-factory/*"

  # The container base image in ./Dockerfile.
  #
  # SUPERSEDED: this used to say the entry produced nothing, because the base
  # was `senzing/senzingsdk-runtime:latest` behind an ARG. It is now a literal
  # `FROM senzing/senzingsdk-runtime:<tag>@sha256:<digest>`, so Dependabot can
  # see it and bumps both halves together.
  - package-ecosystem: "docker"
    assignees:
      - "brianmacy"
    cooldown:
      default-days: 21
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "security"
